name: validate-release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static release checks
        run: |
          python tools/validate_release.py
          python -m compileall -q pipeline paper/scripts tools
